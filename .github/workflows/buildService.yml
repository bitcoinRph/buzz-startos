name: Package

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed full commit SHA on the selected branch
        required: true
        type: string
  pull_request:
    paths-ignore: ['*.md']
  push:
    paths-ignore: ['*.md']
    branches: ['main']

permissions: {}

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # Never run PR-controlled code with a write token from an untrusted fork/bot.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify reviewed checkout and dispatch SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$EXPECTED_SHA" = "$HEAD_SHA"
          fi
          python3 tests/direct-release.test.py

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          docker system prune --all --force || true
          df -h /

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make buildah fuse-overlayfs slirp4netns uidmap squashfs-tools squashfs-tools-ng jq pkg-config libssl-dev

      - name: Configure Docker Buildx
        run: |
          docker buildx create --name startos-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Configure container registries
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          printf 'unqualified-search-registries = ["docker.io"]\n' | sudo tee /etc/containers/registries.conf.d/99-dockerio.conf

      - name: Install pinned Start CLI
        env:
          START_CLI_URL: https://github.com/Start9Labs/start-technologies/releases/download/start-cli/v1.1.0/start-cli_x86_64-linux
          START_CLI_SHA256: 70eff67b6e9a936acd8aaaf787b783819252ecedaa5c74d462e3b15ed4dd843a
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$START_CLI_URL" -o "$HOME/.local/bin/start-cli"
          printf '%s  %s\n' "$START_CLI_SHA256" "$HOME/.local/bin/start-cli" | sha256sum -c -
          chmod +x "$HOME/.local/bin/start-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install npm dependencies
        run: npm ci

      - name: Run wrapper tests
        run: npm test

      - name: Check TypeScript
        run: npm run check

      - name: Run Buzz relay regression tests
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cd buzz
          rustup override set 1.95.0
          cargo test -p buzz-auth ws_and_wss --lib
          cargo test -p buzz-db startos_checksum_repair_allowlist_is_exact --lib
          cargo test --locked -p buzz-auth
          cargo test --locked -p buzz-db -- --test-threads=1

      - name: Initialize ephemeral StartOS developer key
        run: start-cli init-key

      - name: Initialize StartOS packaging workspace
        run: start-cli s9pk init-workspace ..

      - name: Build validation package
        run: |
          make x86_64
          sha256sum buzz_x86_64.s9pk > buzz_x86_64.s9pk.sha256

      - name: Deliver validation assets directly to a new draft RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/direct-release.py
