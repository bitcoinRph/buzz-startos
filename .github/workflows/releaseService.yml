name: Release Service (HOLD)

# No tag push, registry credentials, shared artifact handoff or stable publication.
# Enabling future versioned stable releases requires a separate reviewed change.
on:
  workflow_dispatch:

permissions: {}

jobs:
  security-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed until all stable-release gates are approved
        run: |
          echo 'HOLD: quick-xml advisories, bounded reads, source compliance and StartOS E2E require approval.' >&2
          echo 'Use Package for direct draft validation assets; this workflow never publishes.' >&2
          exit 1
